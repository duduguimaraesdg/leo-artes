<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E07A87">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<script>window.LEO_APP=true</script>
<title>Leo Artes Caderninho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: caderninho digital — cabeçalho com a marca, abas grandes, cartões largos e botões enormes */
:root{
  --bg:#FFF8F7;
  --paper:#FFFFFF;
  --ink:#3B2F33;
  --muted:#7D6B70;
  --line:#F0DEDF;
  --rosa:#E07A87;
  --rosa-soft:#FCE6E8;
  --azul:#4E98B8;
  --azul-soft:#E1F0F6;
  --verde:#3E9466;
  --verde-soft:#E2F3E9;
  --vermelho:#C8483F;
  --vermelho-soft:#FBE4E1;
  --amarelo-soft:#FFF2D6;
  --amarelo:#A86D00;
  --shadow:0 2px 10px rgba(160,90,100,.10);
  --f-marca:"Dancing Script","Brush Script MT",cursive;
  --f-texto:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#211A1C;--paper:#2D2427;--ink:#F7ECEE;--muted:#C2AEB3;--line:#44373B;
  --rosa:#F098A3;--rosa-soft:#4A2F34;--azul:#7CC0DC;--azul-soft:#22394379;
  --verde:#7BCF9F;--verde-soft:#1F3A2B;--vermelho:#F08A80;--vermelho-soft:#46262330;
  --amarelo-soft:#3D3220;--amarelo:#F2C46B;--shadow:0 2px 10px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#211A1C;--paper:#2D2427;--ink:#F7ECEE;--muted:#C2AEB3;--line:#44373B;
  --rosa:#F098A3;--rosa-soft:#4A2F34;--azul:#7CC0DC;--azul-soft:#22394379;
  --verde:#7BCF9F;--verde-soft:#1F3A2B;--vermelho:#F08A80;--vermelho-soft:#46262330;
  --amarelo-soft:#3D3220;--amarelo:#F2C46B;--shadow:0 2px 10px rgba(0,0,0,.3);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-texto);font-size:19px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.wrap{max-width:980px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 8px;flex-wrap:wrap}
.marca{display:flex;align-items:baseline;gap:6px;line-height:1}
.marca .leo{font-family:var(--f-marca);font-size:52px;color:var(--rosa);font-weight:700}
.marca .artes{font-family:var(--f-marca);font-size:40px;color:var(--azul);font-weight:600}
.saudacao{color:var(--muted);font-size:18px}

nav.abas{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0 22px}
nav.abas button{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:17px;min-height:78px}
nav.abas button svg{width:28px;height:28px}
nav.abas button[aria-selected="true"]{background:var(--rosa);border-color:var(--rosa);color:#fff}
@media (max-width:640px){
  nav.abas{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:20;background:var(--paper);border-top:2px solid var(--line);
    padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:4px}
  nav.abas button{font-size:14px;min-height:66px;border-radius:12px;padding:8px 2px}
  .marca .leo{font-size:44px}.marca .artes{font-size:34px}
}

h2{font-size:28px;margin:0 0 4px;font-weight:800;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 18px;font-size:18px}
h3{font-size:22px;margin:0 0 12px;font-weight:800}

.cartao{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.grade{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media (max-width:760px){.g3,.g2{grid-template-columns:1fr}}
section{display:flex;flex-direction:column;gap:18px}

.numero{border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:2px}
.numero .rot{font-size:18px;font-weight:700}
.numero .val{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.numero .obs{font-size:16px;opacity:.85}
.n-verde{background:var(--verde-soft);color:var(--verde)}
.n-vermelho{background:var(--vermelho-soft);color:var(--vermelho)}
.n-azul{background:var(--azul-soft);color:var(--azul)}

.acoes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){.acoes{grid-template-columns:1fr}}
.btn{border:none;border-radius:16px;padding:16px 20px;font-weight:800;font-size:20px;min-height:62px;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn svg{width:26px;height:26px;flex:none}
.btn-rosa{background:var(--rosa);color:#fff}
.btn-azul{background:var(--azul);color:#fff}
.btn-verde{background:var(--verde);color:#fff}
.btn-claro{background:var(--paper);border:2px solid var(--line);color:var(--ink)}
.btn-vermelho{background:var(--vermelho-soft);color:var(--vermelho)}
.btn-peq{min-height:50px;font-size:17px;padding:10px 16px;border-radius:14px}

/* fios */
.fio{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center}
.novelo{width:64px;height:64px;border-radius:50%;position:relative;box-shadow:inset -6px -8px 0 rgba(0,0,0,.14),inset 4px 5px 0 rgba(255,255,255,.25);border:2px solid rgba(0,0,0,.08)}
.novelo::after{content:"";position:absolute;inset:10px;border-radius:50%;border:2px dashed rgba(255,255,255,.45)}
.fio .nome{font-weight:800;font-size:21px}
.fio .info{color:var(--muted);font-size:17px}
.barra{height:16px;background:var(--line);border-radius:10px;overflow:hidden;margin:8px 0 4px}
.barra i{display:block;height:100%;border-radius:10px;background:var(--azul)}
.barra.pouco i{background:var(--vermelho)}
.fio-btns{display:flex;flex-direction:column;gap:8px}
@media (max-width:640px){.fio{grid-template-columns:52px 1fr}.novelo{width:52px;height:52px}.fio-btns{grid-column:1/-1;flex-direction:row}.fio-btns .btn{flex:1}}
.selo{display:inline-block;padding:2px 12px;border-radius:999px;font-size:15px;font-weight:800}
.selo-vermelho{background:var(--vermelho-soft);color:var(--vermelho)}
.selo-verde{background:var(--verde-soft);color:var(--verde)}

/* peças */
.peca{display:flex;flex-direction:column;gap:10px}
.peca .topo{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.peca .nome{font-weight:800;font-size:21px}
.linhas{display:flex;flex-direction:column;gap:6px;font-size:18px}
.linha{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.linha.total{border-top:2px dashed var(--line);padding-top:8px;font-weight:800;font-size:20px}
.foto{aspect-ratio:4/3;width:100%;max-width:100%;border-radius:16px;overflow:hidden;background:var(--rosa-soft);display:grid;place-items:center;border:2px dashed var(--rosa);padding:0;color:var(--rosa);font-weight:800;font-size:18px}
.foto.tem{border:none}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto .vazio{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;text-align:center}
.foto .vazio svg{width:44px;height:44px}
.foto-acoes{display:flex;gap:8px;flex-wrap:wrap}
.foto-acoes .btn{flex:1}
.thumb{width:60px;height:60px;border-radius:12px;object-fit:cover;flex:none;background:var(--rosa-soft);display:grid;place-items:center;color:var(--rosa)}
.thumb svg{width:26px;height:26px}
.pontinhos{display:flex;gap:4px;flex-wrap:wrap}
.pontinhos span{width:20px;height:20px;border-radius:50%;border:2px solid rgba(0,0,0,.1)}

/* caixa */
.mov{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.mov:last-child{border-bottom:none}
.mov .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:26px}
.mov .ic.e{background:var(--verde-soft);color:var(--verde)}
.mov .ic.s{background:var(--vermelho-soft);color:var(--vermelho)}
.mov .d{font-weight:700}
.mov .dt{color:var(--muted);font-size:16px}
.mov .v{font-weight:800;font-variant-numeric:tabular-nums;font-size:20px;white-space:nowrap}
.v.e{color:var(--verde)}.v.s{color:var(--vermelho)}

.aviso{background:var(--amarelo-soft);color:var(--amarelo);border-radius:16px;padding:14px 18px;font-weight:700}

/* janela */
.fundo{position:fixed;inset:0;background:rgba(40,20,25,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 40px max(12px,env(safe-area-inset-left,0px))}
.janela{background:var(--paper);border-radius:24px;padding:24px;width:100%;max-width:620px;margin-top:20px;display:flex;flex-direction:column;gap:16px}
.janela .cab{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fechar{background:var(--rosa-soft);border:none;border-radius:14px;min-width:54px;height:54px;font-size:28px;font-weight:800;color:var(--rosa)}
label.campo{display:flex;flex-direction:column;gap:6px;font-weight:700}
label.campo small{font-weight:600;color:var(--muted);font-size:16px}
input[type=text],input[type=number],select{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px;font-size:20px;width:100%}
input:focus,select:focus{border-color:var(--azul);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:800;font-size:18px;min-height:50px}
.chip[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.cores{display:flex;flex-wrap:wrap;gap:10px}
.cor{width:50px;height:50px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 2px var(--line)}
.cor[aria-pressed="true"]{border-color:var(--paper);box-shadow:0 0 0 4px var(--ink)}
.cor-livre{display:flex;align-items:center;gap:14px;background:var(--bg);border:2px dashed var(--line);border-radius:18px;padding:8px 16px 8px 8px;font-weight:800;cursor:pointer}
.cor-livre.sel{border-style:solid;border-color:var(--ink)}
.cor-livre span{display:flex;flex-direction:column;line-height:1.25}
.cor-livre small{font-weight:600;color:var(--muted);font-size:16px}
.cor-livre input{width:56px;height:56px;flex:none;border:none;border-radius:50%;padding:0;background:conic-gradient(red,orange,yellow,lime,cyan,blue,magenta,red);cursor:pointer}
.cor-livre input::-webkit-color-swatch-wrapper{padding:4px}
.cor-livre input::-webkit-color-swatch{border:3px solid var(--paper);border-radius:50%}
.cor-livre input::-moz-color-swatch{border:3px solid var(--paper);border-radius:50%}
.resumo{background:var(--bg);border-radius:18px;padding:16px 18px}
.grande-final{font-size:34px;font-weight:800;color:var(--verde);font-variant-numeric:tabular-nums}
.linha-ed{display:grid;grid-template-columns:1fr 130px 54px;gap:8px;align-items:center}
.linha-ed .x{background:var(--vermelho-soft);color:var(--vermelho);border:none;border-radius:12px;height:54px;font-size:24px;font-weight:800}
.marcar{display:flex;align-items:center;gap:12px;font-weight:700}
.marcar input{width:28px;height:28px;accent-color:var(--rosa)}
.lista-escolha{display:flex;flex-direction:column;gap:8px}
.escolha{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-weight:800;text-align:left}
.escolha[aria-pressed="true"]{border-color:var(--rosa);background:var(--rosa-soft)}
.escolha span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}

.topo-dir{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ajuda-btn{background:var(--azul-soft);color:var(--azul);border:2px solid var(--azul);border-radius:999px;padding:8px 18px;font-weight:800;font-size:18px;min-height:50px;display:inline-flex;align-items:center;gap:8px}
.ajuda-btn b{width:28px;height:28px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-size:18px}
.bloco{display:flex;flex-direction:column;gap:12px;border-top:2px dashed var(--line);padding-top:16px}
.bloco h3{margin:0;font-size:23px}
.bloco p{margin:0}
.passos{display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none;counter-reset:p}
.passos li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.passos li::before{counter-increment:p;content:counter(p);width:44px;height:44px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}
.passos.rosa li::before{background:var(--rosa)}
.lista-simples{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:8px}
kbd{background:var(--bg);border:2px solid var(--line);border-bottom-width:4px;border-radius:8px;padding:0 8px;font-family:inherit;font-weight:800;white-space:nowrap}
.ok{background:var(--verde-soft);color:var(--verde);border-radius:16px;padding:14px 18px;font-weight:700}
.nao{background:var(--vermelho-soft);color:var(--vermelho);border-radius:16px;padding:14px 18px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:14px 24px;border-radius:16px;font-weight:800;z-index:60;font-size:19px;max-width:90vw;text-align:center}
footer{margin-top:36px;color:var(--muted);font-size:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.rodape-btn{background:none;border:2px solid var(--line);border-radius:12px;padding:8px 14px;color:var(--muted);font-weight:700;font-size:16px}
@media (prefers-reduced-motion:no-preference){.janela{animation:sobe .18s ease-out}@keyframes sobe{from{transform:translateY(12px);opacity:.6}}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="marca" aria-label="Leo Artes"><span class="leo">Leo</span><span class="artes">Artes</span></div>
    <div class="topo-dir"><div class="saudacao" id="saudacao"></div>
      <button class="ajuda-btn" data-acao="ajuda"><b>?</b>Como usar</button></div>
  </header>

  <nav class="abas" role="tablist" id="abas"></nav>
  <main id="tela"></main>

  <footer>
    <span>Esboço · os dados ficam guardados neste aparelho. Os valores de exemplo podem ser apagados.</span>
    <span style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="rodape-btn" id="btnExemplos">Voltar aos exemplos</button>
      <button class="rodape-btn" id="btnZerar">Começar do zero</button>
    </span>
  </footer>
</div>
<div id="janelas"></div>
<input id="inFoto" type="file" accept="image/*" hidden>
<input id="inCopia" type="file" accept=".json,application/json" hidden>

<script>
/* ---------- utilidades ---------- */
const R = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const G = v => (Math.round(Number(v)||0)).toLocaleString('pt-BR')+' g';
const id = () => Math.random().toString(36).slice(2,9);
const hoje = () => new Date().toISOString().slice(0,10);
const dataBR = s => { const [a,m,d]=s.split('-'); return `${d}/${m}/${a}`; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => { const n = parseFloat(String(v).replace(',','.')); return isNaN(n)?0:n; };

const ICON = {
  casa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
  novelo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M6 8c4 1 9 5 11 10M5 13c4 0 8 3 9 7M9 4.6c3 3 7 4 10.6 4"/></svg>',
  bolsa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14l-1.2 11H6.2z"/><path d="M8.5 9V7a3.5 3.5 0 017 0v2"/></svg>',
  venda:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
  caixa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M16 15h2"/></svg>',
  mais:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  menos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  tesoura:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.1 8.1L20 20M8.1 15.9L20 4"/></svg>'
};

/* ---------- dados de exemplo ---------- */
function exemplos(){
  const f = (nome,cor,peso,rest,preco)=>({id:id(),nome,cor,peso,restante:rest,preco});
  const fios = [
    f('Fio de malha Preto','#2B2B2E',1000,620,45),
    f('Fio de malha Azul','#3E7CC4',1000,950,45),
    f('Azul Perolado','#9CC6E0',1000,800,58),
    f('Rosa Pink','#E8318A',1000,310,48),
    f('Terracota','#C8653A',1000,700,45),
    f('Bege Areia','#CDB79C',1000,520,45),
    f('Marrom Café','#4A2C24',1000,640,45),
    f('Verde Sálvia','#8FB79C',1000,140,50),
    f('Branco','#F4F1EE',1000,880,42),
  ];
  const by = n => fios.find(x=>x.nome===n).id;
  const pecas = [
    {id:id(),nome:'Bolsa Artesanal listrada',fios:[{fioId:by('Bege Areia'),g:250},{fioId:by('Terracota'),g:200},{fioId:by('Marrom Café'),g:250}],extras:[{nome:'Alça de couro',v:25},{nome:'Pingente e plaquinha',v:9}],margem:150,preco:185},
    {id:id(),nome:'Bolsa Pink com corrente',fios:[{fioId:by('Rosa Pink'),g:350}],extras:[{nome:'Corrente dourada',v:18},{nome:'Fecho',v:6}],margem:150,preco:150},
    {id:id(),nome:'Cesto com tampa (bege e rosa)',fios:[{fioId:by('Bege Areia'),g:150},{fioId:by('Branco'),g:80}],extras:[{nome:'Puxador de cristal',v:7},{nome:'Coração dourado',v:3}],margem:150,preco:75},
    {id:id(),nome:'Porta-vinho',fios:[{fioId:by('Bege Areia'),g:200}],extras:[{nome:'Alça de couro',v:12}],margem:150,preco:70},
  ];
  const m = (d,tipo,desc,valor)=>({id:id(),data:d,tipo,desc,valor});
  const ym = hoje().slice(0,8);
  const mov = [

function guardarCopia(){
  D.ultimaCopia = hoje(); salvar();
  const dados = JSON.stringify(Object.assign({app:'leo-artes',versao:1,salvoEm:new Date().toISOString()},D));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([dados],{type:'application/json'}));
  a.download=`Leo Artes - copia ${dataBR(hoje()).replace(/\//g,'-')}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  render(); aviso('Cópia guardada na pasta Downloads');
}
function abrirCopia(file){
  const r=new FileReader();
  r.onload=()=>{
    let c; try{ c=JSON.parse(r.result); }catch(e){ c=null; }
    if(!c || !Array.isArray(c.fios) || !Array.isArray(c.mov)){ aviso('Esse arquivo não é uma cópia do caderninho'); return; }
    window._copia=c;
    abrir(`${cab('Abrir esta cópia?')}
      <div class="resumo"><div class="linhas">
        <div class="linha"><span>Cópia guardada em</span><b>${c.salvoEm?dataBR(c.salvoEm.slice(0,10)):'—'}</b></div>
        <div class="linha"><span>Fios</span><b>${c.fios.length}</b></div>
        <div class="linha"><span>Peças</span><b>${(c.pecas||[]).length}</b></div>
        <div class="linha"><span>Anotações de dinheiro</span><b>${c.mov.length}</b></div></div></div>
      <div class="aviso">O que está no caderninho agora vai ser trocado pelo que está nesta cópia.</div>
      <button class="btn btn-verde" data-acao="usarCopia">Sim, usar esta cópia</button>
      <button class="btn btn-claro" data-acao="fechar">Não, deixar como está</button>`);
  };
  r.readAsText(file);
}

/* foto: diminui a imagem antes de guardar, para caber muitas */
function lerFoto(file, cb){
  const r=new FileReader();
  r.onload=()=>{ const img=new Image();
    img.onload=()=>{ const max=700; const s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',.78)); };
    img.onerror=()=>aviso('Não consegui abrir essa foto. Tente outra.');
    img.src=r.result; };
  r.readAsDataURL(file);
}

const fioPorId = i => D.fios.find(f=>f.id===i);
const custoGrama = f => f ? f.preco / f.peso : 0;
function custoPeca(p){
  const fio = p.fios.reduce((s,x)=>s + x.g*custoGrama(fioPorId(x.fioId)),0);
  const ext = p.extras.reduce((s,x)=>s + num(x.v),0);
  return {fio,ext,total:fio+ext};
}
function doMes(){
  const ym = hoje().slice(0,7);
  const l = D.mov.filter(x=>x.data.slice(0,7)===ym);
  const e = l.filter(x=>x.tipo==='e').reduce((s,x)=>s+x.valor,0);
  const s = l.filter(x=>x.tipo==='s').reduce((s2,x)=>s2+x.valor,0);
  return {e,s,l:e-s};
}

function desenharFotoRasc(){
  document.getElementById('pFoto').innerHTML = `<button class="foto ${rasc.foto?'tem':''}" data-acao="fotoRasc" aria-label="Escolher foto">
    ${rasc.foto?`<img src="${rasc.foto}" alt="">`:`<span class="vazio">${ICON.camera}Toque para escolher uma foto ou tirar com a câmera</span>`}</button>`;

}
function desenharRasc(tudo){
  if(tudo){
    document.getElementById('pFios').innerHTML = rasc.fios.map((x,i)=>`<div class="linha-ed">
      <select data-pf="${i}">${D.fios.map(f=>`<option value="${f.id}" ${f.id===x.fioId?'selected':''}>${esc(f.nome)}</option>`).join('')}</select>
      <input type="number" inputmode="numeric" data-pg="${i}" value="${x.g}" aria-label="gramas">
      <button class="x" data-rmf="${i}" aria-label="Tirar">×</button></div>`).join('') + (rasc.fios.length?`<small style="color:var(--muted)">Número = gramas usadas</small>`:'');
    document.getElementById('pExt').innerHTML = rasc.extras.map((x,i)=>`<div class="linha-ed">
      <input type="text" data-en="${i}" value="${esc(x.nome)}" placeholder="Ex.: Corrente">
      <input type="number" inputmode="decimal" data-ev="${i}" value="${x.v}" aria-label="valor em reais">

  }
  const c=custoPeca(rasc); const sug=Math.ceil(c.total*(1+rasc.margem/100));
  if(!rasc.precoManual){ rasc.preco=sug; }
  const inp=document.getElementById('pPreco'); if(document.activeElement!==inp) inp.value=rasc.preco;
  document.getElementById('pRes').innerHTML=`<div class="linhas">
    <div class="linha"><span>Fio</span><span>${R(c.fio)}</span></div>
    <div class="linha"><span>Outros materiais</span><span>${R(c.ext)}</span></div>

    <div class="linha" style="color:var(--verde);font-weight:800"><span>Lucro com o preço escolhido</span><span>${R(rasc.preco-c.total)}</span></div></div>`;
}

/* ---------- cliques ---------- */
document.addEventListener('click',e=>{
  const fundo=e.target.id==='fundo'; if(fundo){fechar();return;}
  const sim=e.target.closest('[data-sim]'); if(sim){simDesc=+sim.dataset.sim;document.querySelectorAll('#simChips .chip').forEach(b=>b.setAttribute('aria-pressed',String(b===sim)));atualizaSim();return;}
  const cor=e.target.closest('[data-cor]'); if(cor){window._cor=cor.dataset.cor;document.getElementById('fCorLivreBox').classList.remove('sel');document.getElementById('fCorLivre').value=cor.dataset.cor.toLowerCase();document.querySelectorAll('#fCores .cor').forEach(b=>b.setAttribute('aria-pressed',String(b===cor)));return;}
  const ug=e.target.closest('[data-ug]'); if(ug){document.getElementById('uG').value=ug.dataset.ug;atualizaUso(fioPorId(document.querySelector('[data-acao=confirmarUso]').dataset.id));return;}
  const mg=e.target.closest('[data-marg]'); if(mg){rasc.margem=+mg.dataset.marg;rasc.precoManual=false;document.querySelectorAll('#pMarg .chip').forEach(b=>b.setAttribute('aria-pressed',String(b===mg)));desenharRasc();return;}
  const rmf=e.target.closest('[data-rmf]'); if(rmf){rasc.fios.splice(+rmf.dataset.rmf,1);desenharRasc(true);return;}
  const rme=e.target.closest('[data-rme]'); if(rme){rasc.extras.splice(+rme.dataset.rme,1);desenharRasc(true);return;}
  const vp=e.target.closest('[data-vp]'); if(vp){venda.pid=vp.dataset.vp;desenharVenda();return;}
  const vd=e.target.closest('[data-vd]'); if(vd){venda.desc=+vd.dataset.vd;desenharVenda();return;}

  const b=e.target.closest('[data-acao]'); if(!b) return;
  const a=b.dataset.acao, bid=b.dataset.id;
  switch(a){
    case 'fechar': fechar(); break;
    case 'ajuda': janelaAjuda(false); break;
    case 'instalar': if(pedidoInstalar){ fechar(); pedidoInstalar.prompt(); pedidoInstalar.userChoice.finally(()=>{ pedidoInstalar=null; render(); }); } break;
    case 'copiarLink': { const u=location.href.split('#')[0];
      (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>aviso('Endereço copiado! Agora cole no Chrome')).catch(()=>aviso('Segure o dedo em cima do endereço para copiar'));
      break; }
    case 'guardarCopia': guardarCopia(); break;
    case 'abrirCopia': { const i=document.getElementById('inCopia'); i.value=''; i.click(); break; }
    case 'usarCopia': D=normalizar(window._copia); salvar(); fechar(); ir('inicio'); aviso('Pronto! A cópia foi colocada no caderninho'); break;
    case 'irFios': ir('fios'); aviso('Toque em "Usei" no fio que você gastou'); break;
    case 'novoFio': janelaFio(); break;
    case 'editarFio': janelaFio(fioPorId(bid)); break;
    case 'usar': janelaUsar(fioPorId(bid)); break;
    case 'salvarFio': {
      const nome=document.getElementById('fNome').value.trim()||'Fio sem nome';
      const peso=num(document.getElementById('fPeso').value)||1000, preco=num(document.getElementById('fPreco').value);
      if(bid){ const f=fioPorId(bid); Object.assign(f,{nome,cor:window._cor,peso,preco,restante:num(document.getElementById('fRest').value)}); aviso('Fio atualizado'); }
      else{
        D.fios.push({id:id(),nome,cor:window._cor,peso,restante:peso,preco});
        if(document.getElementById('fGasto').checked) D.mov.push({id:id(),data:hoje(),tipo:'s',desc:'Comprei rolo: '+nome,valor:preco});
        aviso('Rolo guardado no estoque');
      }
      salvar(); fechar(); render(); break;
    }
    case 'maisRolo': { const f=fioPorId(bid); f.restante+=f.peso; D.mov.push({id:id(),data:hoje(),tipo:'s',desc:'Comprei rolo: '+f.nome,valor:f.preco}); salvar(); fechar(); render(); aviso('Mais um rolo de '+f.nome+' no estoque'); break; }
    case 'apagarFio':
      if(b.dataset.ok){ D.fios=D.fios.filter(f=>f.id!==bid); salvar(); fechar(); render(); aviso('Fio apagado'); }
      else { b.dataset.ok='1'; b.textContent='Toque de novo para apagar mesmo'; }
      break;
    case 'confirmarUso': { const f=fioPorId(bid); const g=num(document.getElementById('uG').value); f.restante=Math.max(0,f.restante-g); salvar(); fechar(); render(); aviso(`Pronto! Sobrou ${G(f.restante)} de ${f.nome}`); break; }
    case 'novaPeca': if(!D.fios.length){aviso('Cadastre um fio primeiro');break;} janelaPeca(); break;
    case 'editarPeca': janelaPeca(D.pecas.find(p=>p.id===bid)); break;
    case 'fotoPeca': pedirFoto(bid); break;
    case 'fotoRasc': pedirFoto('rasc'); break;
    case 'tirarFotoRasc': rasc.foto=''; desenharFotoRasc(); break;
    case 'addFioP': rasc.fios.push({fioId:D.fios[0]?.id,g:100}); desenharRasc(true); break;
    case 'addExtP': rasc.extras.push({nome:'',v:0}); desenharRasc(true); break;
    case 'salvarPeca': {
      rasc.nome=document.getElementById('pNome').value.trim()||'Peça sem nome';
      const p={id:rasc.id||id(),nome:rasc.nome,fios:rasc.fios.filter(x=>x.fioId&&x.g>0),extras:rasc.extras.filter(x=>x.nome||num(x.v)),margem:rasc.margem,preco:num(rasc.preco),foto:rasc.foto||''};
      const i=D.pecas.findIndex(x=>x.id===p.id); if(i>=0) D.pecas[i]=p; else D.pecas.push(p);
      salvar(); fechar(); render(); aviso('Peça salva'); break;
    }
    case 'apagarPeca':
      if(b.dataset.ok){ D.pecas=D.pecas.filter(p=>p.id!==bid); salvar(); fechar(); render(); aviso('Peça apagada'); }
      else { b.dataset.ok='1'; b.textContent='Toque de novo para apagar mesmo'; }
      break;
    case 'vender': if(!D.pecas.length){aviso('Cadastre uma peça primeiro');break;} janelaVender(bid); break;
    case 'confirmarVenda': {
      const p=D.pecas.find(x=>x.id===venda.pid); if(!p) break;
      const fin=p.preco*(1-venda.desc/100);
      D.mov.push({id:id(),data:hoje(),tipo:'e',desc:'Vendi: '+p.nome+(venda.desc?` (desconto ${venda.desc}%)`:''),valor:Math.round(fin*100)/100});
      if(document.getElementById('vBaixa').checked) p.fios.forEach(x=>{const f=fioPorId(x.fioId); if(f) f.restante=Math.max(0,f.restante-x.g);});
      salvar(); fechar(); render(); aviso('Venda anotada! '+R(fin)); break;
    }
    case 'mov': janelaMov(b.dataset.tipo); break;
    case 'salvarMov': {
      const v=num(document.getElementById('mVal').value); if(!v){aviso('Escreva o valor');break;}
      D.mov.push({id:id(),data:hoje(),tipo:b.dataset.tipo,desc:document.getElementById('mDesc').value.trim()||(b.dataset.tipo==='e'?'Entrada':'Gasto'),valor:v});
      salvar(); fechar(); render(); aviso('Anotado'); break;
    }
  }
});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='simPreco') atualizaSim();
  if(t.id==='fCorLivre'){ window._cor=t.value.toUpperCase(); document.querySelectorAll('#fCores .cor').forEach(b=>b.setAttribute('aria-pressed','false')); document.getElementById('fCorLivreBox').classList.add('sel'); }
  if(t.id==='uG') atualizaUso(fioPorId(document.querySelector('[data-acao=confirmarUso]').dataset.id));
  if(t.dataset.pg!==undefined){rasc.fios[+t.dataset.pg].g=num(t.value);desenharRasc();}
  if(t.dataset.ev!==undefined){rasc.extras[+t.dataset.ev].v=num(t.value);desenharRasc();}
  if(t.dataset.en!==undefined){rasc.extras[+t.dataset.en].nome=t.value;}
  if(t.id==='pPreco'){rasc.preco=num(t.value);rasc.precoManual=true;desenharRasc();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='inCopia' && t.files[0]){ abrirCopia(t.files[0]); return; }
  if(t.id==='inFoto' && t.files[0]){
    const alvo=fotoAlvo;
    lerFoto(t.files[0], url=>{
      if(alvo==='rasc'){ if(rasc){ rasc.foto=url; desenharFotoRasc(); } }
      else { const p=D.pecas.find(x=>x.id===alvo); if(p){ p.foto=url; salvar(); render(); aviso('Foto colocada!'); } }
    });
    return;
  }
  if(t.dataset.pf!==undefined){rasc.fios[+t.dataset.pf].fioId=t.value;desenharRasc();}
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') fechar(); });

/* rodapé */
document.getElementById('btnExemplos').addEventListener('click',function(){
  if(!this.dataset.ok){this.dataset.ok='1';this.textContent='Toque de novo para confirmar';return;}
  D=exemplos(); salvar(); this.dataset.ok=''; this.textContent='Voltar aos exemplos'; render(); aviso('Exemplos de volta');
});
document.getElementById('btnZerar').addEventListener('click',function(){
  if(!this.dataset.ok){this.dataset.ok='1';this.textContent='Apaga tudo! Toque de novo';return;}
  D={fios:[],pecas:[],mov:[]}; salvar(); this.dataset.ok=''; this.textContent='Começar do zero'; render(); aviso('Tudo limpo. Comece cadastrando seus fios');
});

/* re-render observa simulador */
const _render=render;
render=function(){ _render(); atualizaSim(); };
render();
let jaViu=false; try{ jaViu = !!localStorage.getItem(CHAVE+'-visto'); }catch(e){ jaViu=true; }
if(!jaViu) janelaAjuda(true);
</script>
